ight", "Number of values", "Root size", "Number of arrays"], "a": 0}, {"q": "AVL trees maintain balance using:", "o": ["Rotations", "Hashing", "Queue operations", "Linear search"], "a": 0}, {"q": "Which traversal is commonly used to copy a tree structure?", "o": ["Preorder", "Only inorder", "Only level order", "Only postorder"], "a": 0}, {"q": "Which sorting algorithm has O(n log n) worst-case complexity and uses a heap?", "o": ["Heap sort", "Bubble sort", "Selection sort", "Insertion sort"], "a": 0}];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

async function startExam(){
const n=document.getElementById("studentName").value.trim();
const e=document.getElementById("studentEmail").value.trim();
if(!n||!e){alert("Enter name and email");return;}
questions=shuffle([...bank]).slice(0,50);
started=true;
document.getElementById("startCard").style.display="none";
try{
if(document.documentElement.requestFullscreen){
await document.documentElement.requestFullscreen();
}
}catch(e){}
document.getElementById("exam").style.display="block";
renderQuestions();
}

function renderQuestions(){
const box=document.getElementById("questions");
box.innerHTML="";
questions.forEach((x,i)=>{
let s='<div class="card"><b>'+ (i+1)+'. '+x.q+'</b>';
x.o.forEach((o,j)=>{
s+='<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>';
});
s+='</div>';
box.innerHTML+=s;
});
}

function recordViolation(reason){
if(submitted||!started)return;
violations++;
if(violations>=MAX_VIOLATIONS){
submitExam("Auto-submitted after 5 violations");
}
}

document.addEventListener("visibilitychange",()=>{
if(document.hidden)recordViolation("Tab/app switch");
});
document.addEventListener("fullscreenchange",()=>{
if(started&&!document.fullscreenElement)recordViolation("Full-screen exited");
});

async function submitExam(status){
if(submitted)return;
submitted=true;
let correct=0,wrong=0,unanswered=0;
questions.forEach((x,i)=>{
const el=document.querySelector('input[name="q'+i+'"]:checked');
if(!el)unanswered++;
else if(Number(el.value)===x.a)correct++;
else wrong++;
});
const score=correct*2-wrong;
const name=document.getElementById("studentName").value.trim();
const email=document.getElementById("studentEmail").value.trim();
document.getElementById("exam").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML='<h2>Exam Result</h2><p>Correct: '+correct+'</p><p>Wrong: '+wrong+'</p><p>Not Attempted: '+unanswered+'</p><p>Score: '+score+'/100</p><p>Status: '+status+'</p><p>Violations: '+violations+'</p>';
try{
await emailjs.send("service_6ojgshw","template_4tztjhk",{
name:name,
exam_name:"DSA Online Exam",
email:email,
correct:String(correct),
wrong:String(wrong),
unanswered:String(unanswered),
score:String(score),
status:status,
violations:String(violations),
submitted_at:new Date().toLocaleString()
});
document.getElementById("mailStatus").innerHTML="<b>Report sent successfully.</b>";
}catch(err){
document.getElementById("mailStatus").innerHTML="<b>Report sending failed.</b><br>"+JSON.stringify(err);
}
}
</script>
