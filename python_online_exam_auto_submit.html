<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Online Exam</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init({
publicKey:"t_1EZrJXF2twbrG-P"
});
</script>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f3f4f6}
.card{background:#fff;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 1px 5px #ccc}
.option{display:block;margin:9px 0;padding:9px;border-radius:8px}
.correct{background:#d9f7df;border:2px solid #2e9b45}
.wrong{background:#ffdcdc;border:2px solid #d33}
.missed{background:#fff1bf;border:2px solid #d49a00}
button{padding:12px 18px;border:0;border-radius:8px;background:#222;color:#fff;font-size:16px;margin:5px}
#warning{display:none;background:#b00020;color:white;padding:12px;border-radius:8px;margin:10px 0}
#result{font-size:19px;font-weight:bold;padding:18px;background:white;border-radius:12px;margin-top:15px}
</style>
</head>
<body>
<h1>Python Online Exam</h1>
  <div class="card">
<label>Student Name</label>
<input id="studentName" type="text" placeholder="Enter your name" required>
<label>Email</label>
<input id="studentEmail" type="email" placeholder="Enter your email" required>
  </div>
<p><b>50 questions</b> | Correct: +2 | Wrong: −1 | Not attempted: 0</p>
<p><b>Rule:</b> Switching tabs/apps or leaving full screen automatically submits the exam.</p>
<button id="fullscreen" type="button">Enter Full Screen</button>
<button id="submit" type="button">Submit Exam</button>
<div id="warning"></div>
<div id="exam"></div>
<div id="result"></div>

<script>
const qs = [["Compiler vs Interpreter", "Which translates the entire program before execution?", "Compiler", "Interpreter", "Python shell", "Debugger", "A"], ["Compiler vs Interpreter", "Which executes code line by line?", "Compiler", "Interpreter", "Linker", "Assembler", "B"], ["Compiler vs Interpreter", "Python is generally described as using which execution approach?", "Only compilation", "Only hardware execution", "Interpretation/bytecode execution", "No execution", "C"], ["Compiler vs Interpreter", "Which usually reports many errors after compilation?", "Compiler", "Interpreter", "Variable", "Loop", "A"], ["Compiler vs Interpreter", "Which is commonly easier for beginners to test one statement at a time?", "Compiler", "Interpreter", "Assembler", "Linker", "B"], ["Variables", "Which is a valid Python variable name?", "2name", "my_name", "my-name", "class", "B"], ["Variables", "What is stored in a variable?", "A value/reference", "Only text", "Only numbers", "Only loops", "A"], ["Variables", "Which statement assigns 10 to x?", "x == 10", "x = 10", "10 = x", "x := 10", "B"], ["Variables", "What is the value of x after x = 5; x = 8?", "5", "8", "13", "Error", "B"], ["Variables", "Which type is 25?", "str", "float", "int", "bool", "C"], ["Variables", "Which type is 3.14?", "int", "float", "str", "list", "B"], ["Variables", "Which type is \"Python\"?", "int", "str", "float", "bool", "B"], ["Variables", "What does type(x) return?", "The value of x", "The type of x", "The name of x", "The size of x", "B"], ["Variables", "What is the output of x=2; y=3; print(x+y)?", "23", "5", "6", "Error", "B"], ["Variables", "Can a Python variable change from int to str?", "Yes", "No", "Only in loops", "Only in functions", "A"], ["For Loop", "How many times does this print? for i in range(3): print(i)", "2", "3", "4", "0", "B"], ["For Loop", "What values does range(3) produce?", "1,2,3", "0,1,2", "0,1,2,3", "3 only", "B"], ["For Loop", "What is the last value of i in for i in range(5)?", "4", "5", "3", "0", "A"], ["For Loop", "How many times does for i in range(2,7): execute?", "4", "5", "6", "7", "B"], ["For Loop", "What values are produced by range(2,5)?", "2,3,4", "2,3,4,5", "1,2,3,4", "3,4,5", "A"], ["For Loop", "What is printed? for i in range(3): print(i)", "0 1 2", "1 2 3", "0 1 2 3", "3 2 1", "A"], ["For Loop", "In a nested loop, what does j usually represent?", "An inner-loop variable", "A compiler", "A data type", "A function", "A"], ["For Loop", "How many times does the inner print execute? for i in range(2): for j in range(3): print(j)", "3", "5", "6", "9", "C"], ["For Loop", "What is the output of for i in range(1,4): print(i)?", "0 1 2", "1 2 3", "1 2 3 4", "0 1 2 3", "B"], ["For Loop", "What does range(5,0,-1) produce?", "5,4,3,2,1", "5,4,3,2,1,0", "0,1,2,3,4", "5,0", "A"], ["While Loop", "Which keyword starts a while loop?", "loop", "while", "repeat", "during", "B"], ["While Loop", "A while loop continues while its condition is:", "False", "True", "Empty", "None only", "B"], ["While Loop", "How many times? i=0; while i<3: print(i); i+=1", "2", "3", "4", "Infinite", "B"], ["While Loop", "What happens if a while-loop condition never becomes false?", "It runs indefinitely", "It runs once", "It gives 0", "It skips the loop", "A"], ["While Loop", "Which operator increases x by 1?", "x--", "x += 1", "x =+ 1", "x ++ 2", "B"], ["While Loop", "What is printed? i=3; while i>0: print(i); i-=1", "3 2 1", "3 2 1 0", "2 1 0", "1 2 3", "A"], ["While Loop", "Which is commonly used to stop a while loop manually?", "break", "stop", "exitloop", "end", "A"], ["While Loop", "What does continue do?", "Ends the program", "Skips to the next iteration", "Stops the loop permanently", "Starts a compiler", "B"], ["While Loop", "What is printed? x=0; while x<2: print(x); x=x+1", "0 1", "1 2", "0 1 2", "0 only", "A"], ["While Loop", "Which is essential to avoid many accidental infinite loops?", "Changing the loop condition/state", "Using a compiler", "Using strings", "Using range only", "A"], ["Range", "What does range(2,8,2) produce?", "2,4,6", "2,4,6,8", "0,2,4,6", "2,3,4,5,6,7", "A"], ["Range", "In range(start, stop), is stop included?", "Yes", "No", "Sometimes", "Only for 0", "B"], ["Range", "What is the default start of range(5)?", "0", "1", "5", "-1", "A"], ["Range", "What is the default step of range(5)?", "0", "1", "2", "-1", "B"], ["Range", "What does range(5,1,-1) produce?", "5,4,3,2", "5,4,3,2,1", "1,2,3,4", "5,1", "B"], ["Mixed", "What is printed? x=2; for i in range(3): print(x+i)", "2 3 4", "0 1 2", "3 4 5", "2 4 6", "A"], ["Mixed", "How many times does print execute? for i in range(4): for j in range(2): print(i,j)", "4", "6", "8", "10", "C"], ["Mixed", "What is the final value of x? x=0; for i in range(5): x=x+1", "4", "5", "6", "0", "B"], ["Mixed", "What is printed? i=1; while i<=3: print(i); i+=1", "1 2 3", "0 1 2", "1 2 3 4", "3 2 1", "A"], ["Mixed", "Which produces 1,3,5?", "range(1,6,2)", "range(1,5,2)", "range(0,6,2)", "range(1,6,1)", "A"], ["Mixed", "What is the value of j on the first inner iteration? for i in range(2): for j in range(3): print(j)", "0", "1", "2", "3", "A"], ["Mixed", "What is printed? for i in range(2): print(i*2)", "0 2", "1 2", "0 1", "2 4", "A"], ["Mixed", "Which creates a loop from 5 down to 1?", "range(5,1)", "range(5,0,-1)", "range(1,5,-1)", "range(5,1,1)", "B"], ["Mixed", "What is the output? x=1; while x<4: x+=1; print(x)", "1 2 3", "2 3 4", "1 2 3 4", "4 only", "B"], ["Mixed", "How many times is j printed? for i in range(1000): for j in range(3): print(j)", "1000", "2000", "3000", "3003", "C"]];
const letters=['A','B','C','D'];
const exam=document.getElementById('exam');
let submitted=false;
let violation=false;

function render(){
  qs.forEach((q,n)=>{
    const d=document.createElement('div');
    d.className='card';
    d.id='card'+n;
    d.innerHTML='<b>Q'+(n+1)+'. '+q[1]+'</b><div>'+
      q.slice(2,6).map((o,i)=>
        '<label class="option"><input type="radio" name="q'+n+'" value="'+letters[i]+'"> '+letters[i]+'. '+o+'</label>'
      ).join('')+'</div>';
    exam.appendChild(d);
  });
  restoreAnswers();
}

function saveAnswers(){
  const a={};
  qs.forEach((q,n)=>{
    const x=document.querySelector('input[name="q'+n+'"]:checked');
    if(x) a[n]=x.value;
  });
  localStorage.setItem('python_exam_answers',JSON.stringify(a));
}

function restoreAnswers(){
  try{
    const a=JSON.parse(localStorage.getItem('python_exam_answers')||'{}');
    Object.keys(a).forEach(n=>{
      const x=document.querySelector('input[name="q'+n+'"][value="'+a[n]+'"]');
      if(x) x.checked=true;
    });
  }catch(e){}
}

document.addEventListener('change',e=>{
  if(e.target.matches('input[type=radio]')) saveAnswers();
});

document.getElementById('fullscreen').addEventListener('click',async()=>{
  try{
    await document.documentElement.requestFullscreen();
  }catch(e){
    alert('Please allow full screen and try again.');
  }
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden && !submitted) {
    violation=true;
    submitExam('Exam automatically submitted because you switched tabs/apps.');
  }
});

document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && !submitted) {
    violation=true;
    submitExam('Exam automatically submitted because you exited full screen.');
  }
});

window.addEventListener('blur',()=>{
  if(!submitted) {
    setTimeout(()=>{
      if(document.hidden && !submitted) {
        violation=true;
        submitExam('Exam automatically submitted because you left the exam window.');
      }
    },150);
  }
});

function submitExam(message=''){
  if(submitted) return;
  submitted=true;
  saveAnswers();

  let correct=0,wrong=0,notAttempted=0;
  qs.forEach((q,n)=>{
    const selected=document.querySelector('input[name="q'+n+'"]:checked');
    const card=document.getElementById('card'+n);
    const labels=card.querySelectorAll('.option');

    labels.forEach((label,i)=>{
      label.classList.remove('correct','wrong','missed');
      if(letters[i]===q[6]) label.classList.add('correct');
    });

    if(!selected){
      notAttempted++;
      labels[letters.indexOf(q[6])].classList.add('missed');
    }else if(selected.value===q[6]){
      correct++;
    }else{
      wrong++;
      labels[letters.indexOf(selected.value)].classList.add('wrong');
    }
  });

  const score=correct*2-wrong;
  emailjs.send("service_6ojgshw","template_gae0niq",{
name:document.getElementById("studentName").value,
exam_name:"Python Online Exam",
email:document.getElementById("studentEmail").value,
correct:correct,
wrong:wrong,
unanswered:notAttempted,
score:score,
status:"Submitted",
violations:violation?"Yes":"No",
submitted_at:new Date().toLocaleString()
}).then(function(){
console.log("Email sent successfully");
}).catch(function(error){
console.error("EmailJS error:",error);
alert("Result calculated, but email could not be sent.");
});
  document.getElementById('warning').style.display=message?'block':'none';
  document.getElementById('warning').textContent=message;
  document.getElementById('result').innerHTML=
    'Final Score: '+score+' / 100<br>'+
    'Correct: '+correct+' | Wrong: '+wrong+' | Not attempted: '+notAttempted+
    (violation?'<br><span style="color:#b00020">Automatic submission due to exam-rule violation.</span>':'');
  document.querySelectorAll('input').forEach(x=>x.disabled=true);
  document.getElementById('submit').disabled=true;
  document.getElementById('fullscreen').disabled=true;
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  window.scrollTo(0,document.body.scrollHeight);
}

document.getElementById('submit').addEventListener('click',()=>submitExam());
render();
</script>
</body>
</html>
